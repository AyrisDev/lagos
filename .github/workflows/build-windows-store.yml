name: Build Windows Store AppX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Store Package (.appx)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js & Generate AppX Package
        run: pnpm run build:appx

      - name: Upload Windows Store AppX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyrisLegal-Windows-Store-AppX
          path: |
            dist/*.appx
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
