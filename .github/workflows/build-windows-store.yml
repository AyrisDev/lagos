name: Build Windows Store AppX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Store Package (.appx)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js & Generate AppX Package
        run: pnpm run build:appx
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supa.ayris.tech
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc4NjEyNDEwMCwiZXhwIjo0OTQxNzk3NzAwLCJyb2xlIjoiYW5vbiJ9.WR672lp6I9qqhgB68i6avw__nmG_9EyCE7FbbUfhosg
          NEXT_PUBLIC_API_URL: https://apexapi.ayris.tech/api/


      - name: Upload Windows Store AppX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyrisLegal-Windows-Store-AppX
          path: |
            dist/*.appx
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
